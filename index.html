
<!doctype html>
<html lang="en" data-theme="dark">

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
    />
    <title>Kyle Close | Portfolio</title>
    <meta name="description" content="Kyle Close — full-stack developer portfolio showcasing React, TypeScript, .NET, and Node.js projects." />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){var r=sessionStorage.redirect;delete sessionStorage.redirect;if(r&&r!==location.href){history.replaceState(null,null,r)}})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
